version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytc-navigator-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=YTC Campus Navigator API
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=ytc-super-secret-jwt-key-2026-campus-navigator-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - DATABASE_URL=sqlite:///./campus.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    volumes:
      - backend-data:/app/data
      - backend-db:/app/campus.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ytc-navigator-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  backend-db:
