<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1000" height="600" fill="#f8fafc"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <!-- Outer Walls -->
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#ffffff" stroke="#059669" stroke-width="4"/>

  <!-- Entrance Foyer -->
  <path d="M 440 560 L 560 560" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
  <rect x="380" y="450" width="240" height="110" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="500" y="515" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">PHARMACY WING FOYER</text>
  <text x="500" y="535" font-family="Inter, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Ground Floor Reception</text>

  <!-- Central Corridor -->
  <rect x="50" y="250" width="900" height="100" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="500" y="308" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#047857" text-anchor="middle" letter-spacing="4">PHARMACEUTICAL RESEARCH CORRIDOR</text>

  <!-- Stairs -->
  <g id="stairs-pharm">
    <rect x="50" y="250" width="70" height="100" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="85" y="305" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">STAIRS</text>
  </g>

  <!-- ROOM PHARM-001: Pharmaceutics Lab 1 (Top Left) -->
  <g id="rm-pharm-001">
    <rect x="130" y="55" width="240" height="185" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="130" y="55" width="240" height="28" rx="6" fill="#15803d"/>
    <text x="250" y="74" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PHARM-001</text>
    <text x="250" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Pharmaceutics Lab 1</text>
    <text x="250" y="145" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Dosage Form Formulation</text>
  </g>

  <!-- ROOM PHARM-002: Pharmaceutical Chemistry Lab (Top Right) -->
  <g id="rm-pharm-002">
    <rect x="630" y="55" width="240" height="185" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="630" y="55" width="240" height="28" rx="6" fill="#1d4ed8"/>
    <text x="750" y="74" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PHARM-002</text>
    <text x="750" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Pharma Chemistry Lab</text>
    <text x="750" y="145" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Organic &amp; Medicinal Synthesis</text>
  </g>

  <!-- ROOM PHARM-003: Pharmacology & Animal House (Bottom Left) -->
  <g id="rm-pharm-003">
    <rect x="130" y="360" width="240" height="180" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <rect x="130" y="360" width="240" height="28" rx="6" fill="#a16207"/>
    <text x="250" y="379" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PHARM-003</text>
    <text x="250" y="430" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#713f12" text-anchor="middle">Pharmacology Lab</text>
    <text x="250" y="450" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Drug Screening &amp; Bioassays</text>
  </g>

  <!-- ROOM PHARM-004: Pharmacy HOD & Faculty Room (Bottom Right) -->
  <g id="rm-pharm-004">
    <rect x="630" y="360" width="240" height="180" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="630" y="360" width="240" height="28" rx="6" fill="#7e22ce"/>
    <text x="750" y="379" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PHARM-004</text>
    <text x="750" y="430" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#581c87" text-anchor="middle">HOD &amp; Faculty Lounge</text>
    <text x="750" y="450" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Pharmacy Staff Room</text>
  </g>
</svg>
