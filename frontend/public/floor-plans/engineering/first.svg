<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="corridorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="#f8fafc"/>
  <rect width="1000" height="600" fill="url(#grid)"/>

  <!-- Outer Walls -->
  <rect x="40" y="40" width="920" height="520" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>

  <!-- Central Corridor -->
  <rect x="50" y="250" width="900" height="100" fill="url(#corridorGrad)" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="500" y="308" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">FIRST FLOOR CORRIDOR</text>

  <!-- West Stairs -->
  <g id="stairs-west">
    <rect x="50" y="250" width="70" height="100" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="85" y="295" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">STAIRS A</text>
    <text x="85" y="315" font-family="Inter, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">West Wing</text>
  </g>

  <!-- East Stairs -->
  <g id="stairs-east">
    <rect x="880" y="250" width="70" height="100" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="915" y="295" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">STAIRS B</text>
    <text x="915" y="315" font-family="Inter, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">East Wing</text>
  </g>

  <!-- Central Elevator / Lift -->
  <g id="elevator-central">
    <rect x="620" y="250" width="70" height="100" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="655" y="295" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">LIFT</text>
    <text x="655" y="315" font-family="Inter, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">Elevator 1</text>
  </g>

  <!-- ROOM ENG-101: Computer Center 1 (Top Left) -->
  <g id="rm-101">
    <rect x="130" y="55" width="220" height="185" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="130" y="55" width="220" height="28" rx="6" fill="#1d4ed8"/>
    <text x="240" y="74" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ENG-101</text>
    <text x="240" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Computer Center 1</text>
    <text x="240" y="145" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Programming &amp; Web Lab</text>
  </g>

  <!-- ROOM ENG-102: Data Structures Lab (Top Center) -->
  <g id="rm-102">
    <rect x="370" y="55" width="220" height="185" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="370" y="55" width="220" height="28" rx="6" fill="#15803d"/>
    <text x="480" y="74" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ENG-102</text>
    <text x="480" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Data Structures Lab</text>
    <text x="480" y="145" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Algorithm Research</text>
  </g>

  <!-- ROOM ENG-105: Faculty Lounge & Staff Room (Top Right) -->
  <g id="rm-105">
    <rect x="610" y="55" width="260" height="185" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <rect x="610" y="55" width="260" height="28" rx="6" fill="#a16207"/>
    <text x="740" y="74" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ENG-105</text>
    <text x="740" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#713f12" text-anchor="middle">Faculty Staff Room</text>
    <text x="740" y="145" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Engineering Department</text>
  </g>

  <!-- Bottom Left: Smart Classroom 101 (ENG-110) -->
  <g id="rm-110">
    <rect x="130" y="360" width="250" height="180" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="130" y="360" width="250" height="28" rx="6" fill="#475569"/>
    <text x="255" y="379" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ENG-110</text>
    <text x="255" y="430" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Classroom 101 (SE)</text>
    <text x="255" y="450" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Interactive Audio-Visual</text>
  </g>

  <!-- Bottom Right: Smart Classroom 102 (ENG-112) -->
  <g id="rm-112">
    <rect x="620" y="360" width="250" height="180" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="620" y="360" width="250" height="28" rx="6" fill="#475569"/>
    <text x="745" y="379" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ENG-112</text>
    <text x="745" y="430" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Classroom 102 (TE)</text>
    <text x="745" y="450" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Lecture Hall 75 Seats</text>
  </g>
</svg>

